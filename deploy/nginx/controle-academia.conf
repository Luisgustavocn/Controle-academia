# Configuracao HTTPS final para o Controle Academia.
# Este arquivo deve ser incluido uma unica vez dentro do contexto `http` do Nginx.

map $request_method $controle_academia_auth_key {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $controle_academia_auth_key zone=controle_academia_auth:10m rate=5r/m;

server {
    listen 80;
    # Habilite apenas se a VPS tiver IPv6 configurado:
    # listen [::]:80;

    server_name painel.academiapowerlife.com;
    server_tokens off;

    access_log /var/log/nginx/controle-academia-access.log;
    error_log  /var/log/nginx/controle-academia-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 308 https://painel.academiapowerlife.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    # Habilite apenas se a VPS tiver IPv6 configurado:
    # listen [::]:443 ssl http2;

    server_name painel.academiapowerlife.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/painel.academiapowerlife.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painel.academiapowerlife.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/controle-academia-access.log;
    error_log  /var/log/nginx/controle-academia-error.log warn;

    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header X-Content-Type-Options;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
    send_timeout 60s;

    limit_req_status 429;
    limit_req_log_level warn;

    location = /api/auth/login {
        limit_req zone=controle_academia_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/auth/setup {
        limit_req zone=controle_academia_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
