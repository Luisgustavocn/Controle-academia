# Template temporario para emitir o primeiro certificado.
# Substitua academia.exemplo.com.br e remova este server block apos ativar o HTTPS.

server {
    listen 80;
    # Habilite apenas se a VPS tiver IPv6 configurado:
    # listen [::]:80;

    server_name academia.exemplo.com.br;
    server_tokens off;

    access_log /var/log/nginx/controle-academia-access.log;
    error_log  /var/log/nginx/controle-academia-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /api/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        return 503;
    }
}
